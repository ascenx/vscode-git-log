name: Release VSIX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version from tag
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          if [[ "$VERSION" == *+* ]]; then
            echo "Build metadata is not supported in release tags: $TAG_NAME" >&2
            exit 1
          fi

          npm version "$VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "Tag $TAG_NAME does not map exactly to package version $PACKAGE_VERSION." >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Package VSIX
        run: npm run package

      - name: Locate VSIX
        id: vsix
        shell: bash
        run: |
          mapfile -t VSIX_FILES < <(find . -maxdepth 1 -type f -name '*.vsix' -print)
          if [[ "${#VSIX_FILES[@]}" -ne 1 ]]; then
            echo "Expected exactly one VSIX package, found ${#VSIX_FILES[@]}." >&2
            exit 1
          fi
          echo "path=${VSIX_FILES[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload packaged VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ github.sha }}
          path: ${{ steps.vsix.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download packaged VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-${{ github.sha }}
          path: release-artifact

      - name: Verify tag and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          git fetch --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          CURRENT_TAG_SHA="$(git rev-list -n 1 "refs/tags/${TAG_NAME}")"
          if [[ "$CURRENT_TAG_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Tag $TAG_NAME now points to $CURRENT_TAG_SHA instead of triggering commit $EXPECTED_SHA." >&2
            exit 1
          fi

          mapfile -t VSIX_FILES < <(find release-artifact -maxdepth 1 -type f -name '*.vsix' -print)
          if [[ "${#VSIX_FILES[@]}" -ne 1 ]]; then
            echo "Expected exactly one downloaded VSIX, found ${#VSIX_FILES[@]}." >&2
            exit 1
          fi
          VSIX_PATH="${VSIX_FILES[0]}"

          VERSION="${TAG_NAME#v}"
          IS_PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
          fi

          set +e
          RELEASE_LOOKUP="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" 2>&1)"
          RELEASE_STATUS=$?
          set -e

          if [[ "$RELEASE_STATUS" -eq 0 ]]; then
            gh release upload "$TAG_NAME" "$VSIX_PATH" --clobber
            gh release edit "$TAG_NAME" \
              --title "$TAG_NAME" \
              --draft=false \
              --prerelease="$IS_PRERELEASE"
          elif grep -q 'HTTP 404' <<<"$RELEASE_LOOKUP"; then
            RELEASE_ARGS=(
              "$TAG_NAME"
              "$VSIX_PATH"
              --title "$TAG_NAME"
              --generate-notes
              --verify-tag
            )
            if [[ "$IS_PRERELEASE" == true ]]; then
              RELEASE_ARGS+=(--prerelease)
            fi
            gh release create "${RELEASE_ARGS[@]}"
          else
            echo "$RELEASE_LOOKUP" >&2
            exit "$RELEASE_STATUS"
          fi
